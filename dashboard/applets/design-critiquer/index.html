<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Web Design Critiquer</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <div class="card-header">
          <h1>Web Design Critiquer</h1>
          <button id="open-settings-button">Settings</button>
        </div>
        <div class="card-body">
          <div class="input-group">
            <textarea id="html-input" placeholder="Paste the HTML of a website to analyze" rows="10"></textarea>
          </div>
          <button id="analyze-button">Analyze</button>
          <div id="results-container"></div>
        </div>
      </div>
    </div>

    <div id="settings-overlay" class="settings-overlay" style="display: none;">
      <div class="settings-panel">
        <div class="settings-header">
          <h2>Settings</h2>
          <button id="close-settings-button">&times;</button>
        </div>
        <div class="settings-body">
          <div class="form-group">
            <label for="openai-api-key">OpenAI API Key</label>
            <input type="password" id="openai-api-key">
          </div>
          <div class="form-group">
            <label for="model-select">Model</label>
            <select id="model-select">
              <option value="gpt-4o">gpt-4o</option>
              <option value="gpt-4-turbo">gpt-4-turbo</option>
              <option value="gpt-3.5-turbo">gpt-3.5-turbo</option>
            </select>
          </div>
          <div class="form-group">
            <label for="temperature-slider">Temperature</label>
            <input type="range" id="temperature-slider" min="0" max="2" step="0.1" value="1.0">
          </div>
        </div>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
